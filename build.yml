# Builds the mod for every platform and merges the results into ONE .geode file.
# Based on geode-sdk/build-geode-mod's multi-platform example. The SDK version is pinned on purpose:
# "latest" may move to a Geode major that targets a newer Geometry Dash than 2.2081.
name: Build Auto Decorator

on:
  workflow_dispatch:
  push:
    branches: ["**"]

env:
  GEODE_SDK_VERSION: v5.10.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows,   os: windows-latest, target: Win64 }
          - { name: macOS,     os: macos-latest,   target: MacOS }
          - { name: Android32, os: ubuntu-latest,  target: Android32 }
          - { name: Android64, os: ubuntu-latest,  target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: ${{ env.GEODE_SDK_VERSION }}
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine into one .geode
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combined
      - uses: actions/upload-artifact@v4
        with:
          name: Auto Decorator (all platforms)
          path: ${{ steps.combined.outputs.build-output }}

  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_tests.sh
      - run: python3 tools/validate_presets.py resources/presets.json
